name: Anforderung
description: Eine neue Anforderung für das Tagebbbuch erfassen
title: "Anforderung: "
body:
  - type: markdown
    attributes:
      value: |
        Eine Anforderung wird nach folgendem Schema formuliert:
        **Zielsystem + Priorität + Systemaktivität + allf. Ergänzungen + Funktionalität + Bedingungen**

        Füllen Sie die Felder aus und setzen Sie sie am Schluss zu einem Satz zusammen.
        Etikettieren Sie die Anforderung anschliessend manuell mit ihrem Typ.

  - type: input
    id: zielsystem
    attributes:
      label: Zielsystem
      description: Das betroffene (Teil-)System
      placeholder: Tagebbbuch
    validations:
      required: true

  - type: dropdown
    id: prioritaet
    attributes:
      label: Priorität
      options:
        - muss (hohe Priorität)
        - soll (mittlere Priorität)
        - wird (niedrige Priorität)
    validations:
      required: true

  - type: dropdown
    id: systemaktivitaet
    attributes:
      label: Systemaktivität
      description: Handelt das System selbständig, bietet es eine Benutzerfunktion, oder braucht es eine Schnittstelle?
      options:
        - dem Benutzer die Möglichkeit bieten (Benutzerfunktion)
        - dem Administrator die Möglichkeit bieten (Benutzerfunktion)
        - fähig sein (Schnittstelle)
        - selbständig handeln
    validations:
      required: true

  - type: input
    id: ergaenzungen
    attributes:
      label: Ergänzungen
      description: Optional, z.B. woher oder womit
      placeholder: über das Eingabeformular

  - type: input
    id: funktionalitaet
    attributes:
      label: Funktionalität
      placeholder: einen Eintrag mit einer Stimmung zu versehen
    validations:
      required: true

  - type: input
    id: bedingungen
    attributes:
      label: Bedingungen
      description: Zeitliche Bedingungen mit "wenn", logische Bedingungen mit "falls"
      placeholder: falls der Benutzer eingeschrieben ist

  - type: textarea
    id: anforderung
    attributes:
      label: Anforderung als vollständiger Satz
      description: Setzen Sie die Felder von oben zu einem Satz zusammen.
      placeholder: Tagebbbuch muss dem Benutzer die Möglichkeit bieten, über das Eingabeformular einen Eintrag mit einer Stimmung zu versehen, falls der Benutzer eingeschrieben ist.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        | Given | When | Then |
        | :---: | :---: | :---: |
        | Some situation | Something happens | Something else happens |

  - type: textarea
    id: subtasks
    attributes:
      label: Subtasks
      value: |
        - [ ] First subtask
        - [ ] Second subtask